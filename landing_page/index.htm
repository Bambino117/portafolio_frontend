<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <div class="navbar">
            <div class="logo">
                ATMOS
            </div>
            
            <ul>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="500"><a href="#">Home&nbsp;<i class="fa-solid fa-chevron-down"></i></a></li>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="600"><a href="#">Pages&nbsp;<i class="fa-solid fa-chevron-down"></i></a></li>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="700"><a href="#">Services&nbsp;<i class="fa-solid fa-chevron-down"></i></li>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="800"><a href="#">Event&nbsp;<i class="fa-solid fa-chevron-down"></i></a></li>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="900"><a href="#">Price&nbsp;<i class="fa-solid fa-chevron-down"></i></a></li>
                <li data-aos="fade-down" data-aos-easing="linear" data-aos-duration="1000"><a href="#">Contact Us&nbsp;</a></li>
                
                <li>
                    <div class="icons" style="display: none;" id="nav_icons">
                        <div class="icon"><i class="fa-solid fa-circle-user"></i></div>
                        
                        <div class="search_bar">
                            <input type="text" placeholder="search...">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                </li>
            </ul>
            
            <div class="icons" id="icons">
                <div class="icon"><i class="fa-solid fa-circle-user"></i></div>
                
                <div class="search_bar">
                    <input type="text" placeholder="search...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        
        <div class="content_wrapper">
            <div class="content">
                <h1 data-aos="fade-right" data-aos-duration="1000">Servicios profesioanles para empresas </h1>
                
                <span data-aos="fade-right" data-aos-duration="2000">Experiencia en: <br> 
                    Frontend, Analisis de Datos, Marketing Digital. <br>
                    Deja de buscar, contactame y trabajemos en el siguiente proyecto!
                </span>
                
                <button data-aos="fade-right" data-aos-duration="3000">Agenda aquí</button>
                
                <p data-aos="fade-right" data-aos-duration="3000">Have questions? <a href="#">Get Free Form&nbsp;&nbsp; <i class="fa-solid fa-arrow-right"></i></a> </p>

            <div class="content-image">
                <img src="media/imagen/profile/perfil.jpg" alt="" class="main_img">
                <img src="media/imagen/shapes/about-shape-1.png" alt="" style="position: absolute;" class="shape shape1">
                <img src="media/imagen/shapes/shape-1.jpg" alt="" style="position: absolute;" class="shape shape2">
                <img src="media/imagen/shapes/shape-1.jpg" alt="" style="position: absolute;" class="shape shape3">
                <img src="media/imagen/shapes/shape-1.jpg" alt="" style="position: absolute;" class="shape shape4">
                <div class="shape shape5"></div>
            </div>
        </div>

        <div class="client_wrapper">
            <img src="media/imagen/clients/google.png" alt="" class="scroll">
            <img src="media/imagen/clients/airbnb.png" alt="" class="scroll">
            <img src="media/imagen/clients/uber.png" alt="" class="scroll">
            <img src="media/imagen/clients/netflix.png" alt="" class="scroll">
            <img src="media/imagen/clients/spotify.png" alt="" class="scroll">
            <img src="media/imagen/clients/microsoft.png" alt="" class="scroll">
            
            <img src="media/imagen/clients/google.png" alt="" class="scroll">
            <img src="media/imagen/clients/airbnb.png" alt="" class="scroll">
            <img src="media/imagen/clients/uber.png" alt="" class="scroll">
            <img src="media/imagen/clients/netflix.png" alt="" class="scroll">
            <img src="media/imagen/clients/spotify.png" alt="" class="scroll">
            <img src="media/imagen/clients/microsoft.png" alt="" class="scroll">

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="main.js"></script>

    <script>
        AOS.init();
    </script>
